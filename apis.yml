aid: opendorse
name: Opendorse
description: >-
  Opendorse is an athlete marketplace and name, image and likeness (NIL) technology
  company headquartered in Lincoln, Nebraska. Its platform lets brands, fans, schools,
  collectives and sponsors send endorsement deals to athletes, and lets athletes
  understand, price, accept and fulfill those deals. The product set spans Opendorse
  Deals (an open athlete endorsement marketplace), Opendorse Social (branded social
  content scheduling, delivery and publishing across X, Facebook, Instagram, TikTok
  and LinkedIn), Opendorse Ready (athlete NIL education), Opendorse Compliance and
  Disclosure (deal disclosure workflows and reporting for athletic departments),
  Contracts, Team Builder, and data products including Market Intel and the Athlete
  Rate Card fair-market-value estimate. Opendorse works with more than 100 NCAA
  athletic departments and with the USOPC, NFLPA, MLBPA, NBPA, NHLPA, PGA TOUR and
  LPGA. It ships an end-user product only: as of this profile Opendorse publishes no
  public developer portal, API reference or machine-readable contract.
